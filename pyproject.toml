[tool.poetry]
name = "embedding-with-rag"
version = "0.1.0"
description = "Rag (Retrieval Augmented Generation) Python solution with llama3, LangChain, Ollama, and ChromaDB in a Flask API-based solution"
authors = ["Your Name <you@example.com>"]
license = "Apache License"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.9.7 || >3.9.7,<3.13"
flask = "^3.0.3"
langchain = "^0.2.11"
langchain-community = "^0.2.10"
fastembed = "^0.3.4"
pdfplumber = "^0.11.4"
fastapi = { extras = ["standard"], version = "^0.112.2" }
langchain-chroma = "^0.1.3"
aiohttp = "3.9.5"
protobuf = "<=3.20.9"
flet = "^0.23.2"
streamlit = "^1.38.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
